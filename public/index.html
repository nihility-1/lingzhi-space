function waveComp(n){


  const g=[];


  g.push({t:'slime', n:Math.min(13, 2+Math.floor(n*0.55))});


  if(n>=4) g.push({t:'runner', n:Math.min(8, 1+Math.floor(n*0.55))});

  if(n>=6) g.push({t:'split', n:Math.min(4, Math.floor(n/3))});


  if(n>=8) g.push({t:'healer', n:Math.min(2, Math.floor(n/5))});


  if(n>=8 && n%5===0) g.push({t:'boss', n:Math.min(2, 1+Math.floor(n/12))});


  return g;

let AC=null,MG=null,SFXMuted=false,lastHitAt=0;


function actx(){


  try{


    if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); MG=AC.createGain(); MG.gain.value=0.26; MG.connect(AC.destination); }


    if(AC.state==='suspended') AC.resume();


    return AC;


  }catch(e){ return null; }


}


function tone(f,dur,type,vol,f2,delay){


  if(SFXMuted) return; const c=actx(); if(!c) return;


  const t0=c.currentTime+(delay||0);


  const o=c.createOscillator(), g=c.createGain();


  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);


  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);


  g.gain.setValueAtTime(0.0001,t0);


  g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.01);


  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);


  o.connect(g); g.connect(MG); o.start(t0); o.stop(t0+dur+0.03);


}


function nz(dur,vol,freq,q,delay){


  if(SFXMuted) return; const c=actx(); if(!c) return;


  const n=Math.max(1,Math.floor(c.sampleRate*dur)); const b=c.createBuffer(1,n,c.sampleRate); const d=b.getChannelData(0);


  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);


  const src=c.createBufferSource(); src.buffer=b;


  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; f.Q.value=q||1;


  const g=c.createGain(); g.gain.value=vol||0.2;


  src.connect(f); f.connect(g); g.connect(MG);


  src.start(c.currentTime+(delay||0));


}

function mergeHits(hits){


  const out=[];


  for(const h of hits){


    const c=out.find(o=>o.k===h.k);


    if(!c){ out.push(Object.assign({},h)); continue; }


    if(h.k==='slow'){ c.f=Math.min(0.85,(c.f||0)+(h.f||0)); c.dur=Math.max(c.dur||0,h.dur||0); }


    else if(h.k==='stun'){ c.dur=Math.min(2.5,(c.dur||0)+(h.dur||0)); }


    else if(h.k==='mark'){ c.dur=(c.dur||0)+(h.dur||0); }


    else if(h.k==='poison'||h.k==='burn'){ c.dps=(c.dps||0)+(h.dps||0); c.dur=Math.max(c.dur||0,h.dur||0); }


    else if(h.k==='weak'){ c.f=Math.min(c.f??1,h.f??1); c.dur=Math.max(c.dur||0,h.dur||0); }


  }


  return out;


}


function recalc(sk){


  const b=sk.base;


  let st={dmg:b.dmg,cd:b.cd,targets:1,crit:0.08,critMult:1.6,onHit:(b.onHit||[]).slice(),heal:0,guardPerWave:0,ctrlDur:0,summonDmg:0,summonCount:0,markDur:0,markBonus:0,healShield:false,killHeal:0,dmgTaken:0,elemBonus:{},healBonus:0,elemAll:0,killHeal:0,rampPerWave:0.03,execute:false,

      case 'cdr': st.cd*=0.8;break;


      case 'cdfast': st.cd*=0.88;break;


      case 'critup': st.crit+=0.12;break;


      case 'dmg35': st.dmgBonus+=0.35;break;


      case 'ctrlplus': st.ctrlDur+=0.6;break;


      case 'guardplus': st.guardPerWave+=6;break;

      case 'splashup': st.splashF=(st.splashF||0.3)*1.5;break;


      case 'ramp': st.rampPerWave+=0.08;break;

function cast(sk,ox,oy){


  const st=sk.stats;


  if(sk.base.elem){ sfxCast(sk.base.elem); S.rings.push({x:typeof ox==='number'?ox:34,y:typeof oy==='number'?oy:playerY(),r:6,max:56,t:0.4,c:ECOL[sk.base.elem]||'#8a7a63'}); }


  const ramp0=(1+S.wave*st.rampPerWave)*(1+st.modBonus*sk.mods.length);


  if(sk.base.kind==='buff'){


    S.shield=Math.min(60,S.shield+25); S.wardT=3; SFX.buff();


    S.texts.push({x:34,y:playerY()-42,txt:'护身',t:0.9,color:'#8a7f9c'});


    return;


  }


  if(sk.base.kind==='heal'){


    const want=st.dmg*ramp0*(1+(st.healBonus||0)); const before=S.hp;


    S.hp=Math.min(S.maxhp,S.hp+want);


    const real=S.hp-before;


    if(S.stats) S.stats.heal=(S.stats.heal||0)+real; SFX.heal();


    if(st.healShield){ const over=want-real; if(over>0) S.shield=Math.min(60,S.shield+over); }


    S.texts.push({x:34,y:playerY()-30,txt:'+'+Math.round(real),t:0.9,color:'#8fbf8a'});


    return;


  }


  if(sk.base.kind==='summon'){


    const n=1+st.summonCount;


    for(let i=0;i<n;i++) S.summons.push({x:ox+16,y:oy+(i-(n-1)/2)*26,dmg:st.dmg*ramp0*(1+st.summonDmg),until:S.t+6,atk:0,r:10,color:sk.base.color});


    S.texts.push({x:34,y:playerY()-30,txt:'虎',t:0.7,color:'#b07a45'});


    return;


  }


  const alive=S.enemies.filter(e=>!e.dead).sort((a,b)=>a.x-b.x);


  if(!alive.length) return;


  const ramp=(1+S.wave*st.rampPerWave)*(1+st.modBonus*sk.mods.length);


  const targets=alive.slice(0,Math.max(1,st.targets));


  for(const t of targets){


    let dmg=st.dmg*ramp;


    let em=elemMul(sk.base.elem,t.elem);


    if(st.wuxing && em>1) em*=1.5;


    if(st.sameelem && sk.base.elem===t.elem) em*=1.5;


    const eb=st.elemBonus[sk.base.elem]||0; if(eb) em*=1+eb; if(st.elemAll) em*=1+st.elemAll;


    dmg*=em;


    if(t.markT>0) dmg*=1+st.markBonus;


    if(st.dmgTaken) {}


    if(st.execute && t.hp/t.maxhp<0.3) dmg*=2;


    if(st.slowDmg && t.slowT>0) dmg*=1+st.slowDmg;


    if(st.highhp && t.hp/t.maxhp>0.8) dmg*=1+st.highhp;


    if(st.bosslayer && t.type==='boss') dmg*=1+st.bosslayer;


    if(st.armorpen && (t.type==='tank'||t.type==='boss')) dmg*=1+st.armorpen;


    if(st.cull && t.hp/t.maxhp<0.25) dmg*=1.8;


    if(st.shielddmg && S.shield>0) dmg*=1.2;


    if(st.rage) dmg*=1+(1-S.hp/S.maxhp)*0.5;


    if(st.backwater && S.hp/S.maxhp<0.3) dmg*=1.5;


    if(st.dawn && S.hp>=S.maxhp) dmg*=1.4;


    if(st.fewskill && S.skills.length<3) dmg*=1.3;


    if(st.latewave && S.wave>=15) dmg*=1.35;


    if(st.bosswave && S.wave%5===0) dmg*=1.6;


    if(st.summoner) dmg*=1+Math.min(0.3,(S.summons||[]).filter(function(z){return z.until>S.t;}).length*0.06);


    if(sk.base.breakshield && (t.shield||0)>0){ dmg+=(t.shield||0)*0.8; t.shield=(t.shield||0)*0.25; }


    if(sk.base.detonate && ((t.poi||0)>0 || (t.burn||0)>0)) dmg*=1.6;


    const crit=Math.random()<st.crit;


    if(crit) dmg*=st.critMult;


    damage(t,dmg,crit);


    if(sk.base.drain){ S.hp=Math.min(S.maxhp,S.hp+dmg*sk.base.drain); }


    S.bolts.push({x1:ox,y1:oy,x2:t.x,y2:t.y,life:0.16,color:sk.base.color});


    const spf=st.splashF||sk.base.splashF||0;


    if(spf){


      for(const o of alive){ if(o!==t && !o.dead && Math.hypot(o.x-t.x,o.y-t.y)<(spf>0.5?100:70)) damage(o,dmg*spf,false); }


    }


    if(st.multihit) damage(t,dmg*st.multihit,false);


    const fzc=st.freezeChance||sk.base.freezeChance||0;


    if(fzc && Math.random()<fzc){ t.slowF=1; t.slowT=1; }


    for(const h of st.onHit){


      if(h.k==='burn'){


        t.burn=Math.max(t.burn,h.dps); t.burnT=Math.max(t.burnT,h.dur);


        if(st.burnSpread){ for(const o of alive){ if(o!==t && Math.hypot(o.x-t.x,o.y-t.y)<60){o.burn=Math.max(o.burn,h.dps*0.5);o.burnT=Math.max(o.burnT,h.dur);} } }


      }


      if(h.k==='poison'){ t.poi=Math.min(st.deepPoison?6:3,(t.poi||0)+1); t.poiT=h.dur; t.poiDps=h.dps; }


      if(h.k==='slow'){ t.slowF=Math.max(t.slowF||0,h.f); t.slowT=Math.max(t.slowT||0,h.dur+st.ctrlDur); }


      if(h.k==='mark'){ t.markT=Math.max(t.markT||0,h.dur+st.markDur); }


      if(h.k==='weak'){ t.weakF=h.f; t.weakT=Math.max(t.weakT||0,h.dur+st.ctrlDur); }


      if(h.k==='knock'){ t.x+=18+(st.knockBonus||0); }


      if(h.k==='stun'){ t.stunT=Math.max(t.stunT||0,h.dur); }


      if(h.k==='charm'){ t.charmT=Math.max(t.charmT||0,h.dur); }


      if(h.k==='echo'){ t.echoT=h.dur; t.echoMul=h.mul||0.6; t.echoDmg=dmg*(h.mul||0.6); }


      if(h.k==='chain'){


        let jumps=1+st.chainN, cur=t;


        for(let j=0;j<jumps;j++){


          const c=alive.find(e=>e!==cur && !e.dead);


          if(!c) break;


          damage(c,dmg*h.f,false); cur=c;


        }


      }


    }


    if(st.heal) S.hp=Math.min(S.maxhp,S.hp+dmg*st.heal);


    if(st.shieldOnHit) S.shield=Math.min(30,S.shield+st.shieldOnHit);


    if(crit && st.critHeal) S.hp=Math.min(S.maxhp,S.hp+st.critHeal);


    if(t.dead && st.killHeal) S.hp=Math.min(S.maxhp,S.hp+st.killHeal);


  }


}





function spawnWave(){


  const w=waveComp(S.wave);


  const over=Math.max(0,S.wave-25);


  const hpScale=Math.pow(SCALE.hp,S.wave-1)*Math.pow(1.06,over);


  let i=0;


  for(const g of w){


    const t=TYPES[g.t]; const FIVE=['金','木','水','火','土'];


    for(let k=0;k<g.n;k++){


      S.enemies.push({type:g.t,elem:FIVE[Math.floor(Math.random()*5)],x:cvs.clientWidth*0.72+(i%4)*46+rnd(-5,5),y:rnd(55,Math.max(90,cvs.clientHeight-55)),


        hp:t.hp*hpScale*1.05,maxhp:t.hp*hpScale*1.05,sp:t.sp*(1+Math.min(0.5,SCALE.spd*(S.wave-1))),r:t.r,


        dmg:t.dmg*1.05*(1+SCALE.dmg*(S.wave-1))*(1+0.03*over),


        burn:0,burnT:0,poi:0,poiT:0,slowT:0,slowF:0,hit:0,stunT:0,affix:null,affixT:1.2});


      i++;


    }


  }


  if(S.wave>=12){


    const list=Object.keys(AFFIX);


    for(const e of S.enemies){


      if(e.type==='split'||Math.random()>Math.max(0.25,0.5-0.01*over)) continue;


      e.affix=list[Math.floor(Math.random()*list.length)];


      if(e.affix==='suoyu'){ e.hp*=1.15; e.maxhp*=1.15; }


    }


  }


  let sh=0, gd=0;


  for(const sk of S.skills){ sh+=sk.stats.shieldStart; gd+=sk.stats.guardPerWave; }


  if(sh) S.shield=Math.min(40,S.shield+sh);


  if(gd) S.shield=Math.min(40,S.shield+gd);


}





let last=performance.now();


function loop(now){


  const dt=Math.min(0.05,(now-last)/1000); last=now;


  if(S.running && !S.drafting && !S.over) step(dt);


  if(S.running && !S.over && S.hp<=0){ S.hp=0; gameOver(); }


  draw();


  requestAnimationFrame(loop);


}





function step(dt){


  if(S.paused) return;


  S.t+=dt;


  if(S.shake>0){ S.shake=Math.max(0,S.shake-dt*26); cvs.style.transform=S.shake>0.2?('translate('+rnd(-S.shake,S.shake).toFixed(1)+'px,'+rnd(-S.shake,S.shake).toFixed(1)+'px)'):''; }


  if(S.rings&&S.rings.length){ for(const r of S.rings){ r.t-=dt; r.r+=(r.max-r.r)*Math.min(1,dt*9); } S.rings=S.rings.filter(r=>r.t>0); }


  if(S.parts&&S.parts.length){ for(const q of S.parts){ q.t-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=150*dt; } S.parts=S.parts.filter(q=>q.t>0); }


  if(S.fearT>0) S.fearT-=dt;


  if(S.wardT>0) S.wardT-=dt;


  const py=playerY();


  const mit=Math.max(0,...S.skills.map(k=>1-(k.stats.dmgTaken||0)))*(S.wardT>0?0.7:1);


  for(const sk of S.skills){ sk.cd=Math.max(0,sk.cd-dt); if(sk.cd<=0){ cast(sk,34,py); sk.cd=sk.stats.cd; } }


  for(const e of S.enemies){


    if(e.markT>0) e.markT-=dt;


    if(e.weakT>0) e.weakT-=dt;


  }


  for(const sm of S.summons){


    if(S.t>sm.until){ sm.dead=true; continue; }


    sm.atk-=dt;


    if(sm.atk<=0){


      const tgt=S.enemies.filter(e=>!e.dead).sort((a,b)=>a.x-b.x)[0];


      if(tgt){ damage(tgt,sm.dmg,false); S.bolts.push({x1:sm.x,y1:sm.y,x2:tgt.x,y2:tgt.y,life:0.12,color:sm.color}); sm.atk=0.8; }


    }


  }


  S.summons=S.summons.filter(x=>!x.dead);


  for(const e of S.enemies){


    if(e.dead) continue;


    if(e.affix==='shengling') e.hp=Math.min(e.maxhp,e.hp+e.maxhp*0.012*dt);


    if(e.affix==='kongjian'){ e.affixT-=dt; if(e.affixT<=0){ e.x-=30; e.affixT=1.8; } }


    if(e.burnT>0){ e.burnT-=dt; e.hp-=e.burn*dt; if(e.hp<=0){kill(e);continue;} }


    if(e.poiT>0){ e.poiT-=dt; e.hp-=e.poiDps*(e.poi||1)*dt; if(e.hp<=0){kill(e);continue;} }


    if(e.type==='healer'){ for(const o of S.enemies){ if(o!==e && !o.dead && Math.hypot(o.x-e.x,o.y-e.y)<120) o.hp=Math.min(o.maxhp,o.hp+7*dt); } }


    if(e.slowT>0) e.slowT-=dt;


    if(e.echoT>0){ e.echoT-=dt; if(e.echoT<=0 && !e.dead) damage(e,e.echoDmg||0,false); }


    if(e.charmT>0){ e.charmT-=dt; e.x+=e.sp*0.8*dt; continue; }


    if(e.stunT>0){ e.stunT-=dt; continue; }


    const slow=e.slowT>0?(1-e.slowF):1;


    e.x-=e.sp*slow*dt;


    e.hit=Math.max(0,e.hit-dt);


    if(e.x<54){


      const xm=(e.affix==='yuling'?1.35:1)*(1+(S.fearT>0?0.2:0));


      S.hp-=e.dmg*xm*(e.weakT>0?e.weakF:1)*mit*dt;


      if(e.affix==='xinling') S.fearT=3;


      e.x=54;


    }


  }


  for(const t of S.texts) t.t-=dt;


  S.texts=S.texts.filter(t=>t.t>0);


  for(const b of S.bolts) b.life-=dt;


  S.bolts=S.bolts.filter(b=>b.life>0);


  S.enemies=S.enemies.filter(e=>!e.dead);


  if(S.shield>0) S.shield=Math.max(0,S.shield-6*dt);


  for(const e of S.enemies){ if(!e.dead && (!isFinite(e.hp) || e.hp<=0.5)) kill(e); }


  if(S.hp<=0){ S.hp=0; gameOver(); }


  if(S.over) return;


  if(!S.enemies.length && !S.drafting) waveClear();


  hpBar.style.width=(S.hp/S.maxhp*100)+'%';


  hpTxt.textContent=Math.ceil(S.hp);


  shieldTxt.textContent=S.shield>0?('护盾 '+Math.floor(S.shield)):'';


  const upd=(host,list)=>{[...host.children].forEach((el,i)=>{const sk=list[i];if(!sk)return;el.querySelector('.cd').style.transform='scaleY('+Math.min(1,sk.cd/Math.max(.01,sk.stats.cd))+')';});};


  upd(skillsEl,S.skills);


}





function openStats(){


  S.paused=true;


  const t=Math.max(1,S.t), _dmg=isFinite(S.stats.dmg)?S.stats.dmg:0, dps=Math.round(_dmg/t);


  const mm=Math.floor(S.t/60), ss=String(Math.floor(S.t%60)).padStart(2,'0');


  let h='<h1>数据</h1><p>第 '+S.wave+' 波 · 存活 '+mm+':'+ss+'</p>';


  h+='<div style="font-size:13px;line-height:1.9;color:#4a3d2f">';


  h+='HP '+Math.ceil(S.hp)+' / '+S.maxhp+(S.shield>0?' · 护盾 '+Math.floor(S.shield):'')+'<br>';


  h+='场上敌人 '+S.enemies.length+' · 击杀 '+S.stats.kills+'<br>';


  h+='总伤害 '+Math.round(isFinite(S.stats.dmg)?S.stats.dmg:0)+' · 均伤 '+dps+'/秒<br>';


  h+='回复 '+((isFinite(S.stats.heal)?S.stats.heal:0)).toFixed(0)+' · 均回 '+(S.stats.heal?((S.stats.heal/Math.max(1,S.t))*1).toFixed(1):'0')+'/秒<br>';


  h+='词条池 '+MODS.length+' 条 · 已装 '+S.skills.reduce((a,s)=>a+s.mods.length,0)+' 条';


  h+='</div><hr style="border-color:#d8cbb2;margin:10px 0">';


  for(const sk of S.skills){


    const st=sk.stats, real=st.dmg*(1+S.wave*st.rampPerWave);


    h+='<div style="font-size:13px;line-height:1.9;margin-bottom:8px">';


    const pick=sk.base.kind==='heal'?('回血约 '+Math.round(real*(1+(st.healBonus||0)))):(sk.base.kind==='summon'?('召唤伤害约 '+Math.round(real*(1+st.summonDmg))):('每击约 '+Math.round(real)+' · 目标 '+st.targets+' · 暴击 '+Math.round(st.crit*100)+'%'));


    h+='<b style="color:'+sk.base.color+'">'+sk.base.name+'</b>（'+sk.base.elem+'） · '+pick+' · 冷却 '+st.cd.toFixed(2)+'s';


    h+='<br><span style="color:#7a6a56">词条：'+(sk.mods.map(m=>m.name).join('、')||'无')+'</span>';


    h+='</div>';


  }


  panel.innerHTML=h+'<button class="btn" id="closeStats">关掉</button>';


  overlay.style.display='flex';


  panel.querySelector('#closeStats').onclick=()=>{ overlay.style.display='none'; S.paused=false; };


}





const INKCOL={slime:'#8fae7f',runner:'#c9a86a',tank:'#8a7fa0',split:'#c98f8f',healer:'#7fae9f',boss:'#b58a5a'};


function draw(){


  const W=cvs.clientWidth,H=cvs.clientHeight;


  // ---- 水墨背景 ----


  const g=ctx.createLinearGradient(0,0,0,H);


  g.addColorStop(0,'#f4efe2');g.addColorStop(.55,'#ede4d1');g.addColorStop(1,'#e3d7c0');


  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);


  // 远山


  ctx.save();


  const far=(mh,col,yo)=>{


    ctx.beginPath();ctx.moveTo(0,H*yo);


    const n=7;


    for(let i=0;i<=n;i++){


      const x=W*i/n, y=H*yo-mh*(0.35+0.65*Math.abs(Math.sin(i*1.7+0.6)));


      ctx.quadraticCurveTo(x-W/n*0.5,H*yo-mh*0.3,x,y);


    }


    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();


    ctx.fillStyle=col;ctx.fill();


  };


  far(H*0.16,'rgba(122,108,86,.13)',0.42);


  far(H*0.12,'rgba(96,84,64,.10)',0.52);


  // 月


  ctx.globalAlpha=.5;ctx.fillStyle='#f7f1e2';ctx.beginPath();ctx.arc(W*0.78,H*0.13,26,0,7);ctx.fill();


  ctx.globalAlpha=1;


  // 竹影（右）


  const bamboo=(x0,w,col)=>{


    ctx.strokeStyle=col;ctx.lineWidth=w;


    for(let k=0;k<3;k++){


      const x=x0+k*9;


      ctx.beginPath();ctx.moveTo(x,H*0.15);ctx.quadraticCurveTo(x-6,H*0.55,x-2,H*1.02);ctx.stroke();


      for(let j=1;j<7;j++){


        const yy=H*(0.2+j*0.11);


        ctx.lineWidth=Math.max(1,w-1);ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+16-j*1.5,yy-9);ctx.stroke();


      }


    }


  };


  bamboo(W-4,3,'rgba(58,92,62,.16)');


  // 墨点


  const seed=(n)=>Math.abs(Math.sin(n*127.1)*43758.5453)%1;


  ctx.fillStyle='rgba(40,34,26,.05)';


  for(let i=0;i<26;i++){


    const x=seed(i+1)*W, y=seed(i+11)*H, r=2+seed(i+21)*7;


    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();


  }


  // 地面淡墨


  ctx.fillStyle='rgba(110,92,66,.07)';ctx.fillRect(0,H*0.86,W,H*0.14);

  const px=34,py=playerY();


  const orb=(y,color,label)=>{


    ctx.save();ctx.shadowColor=color;ctx.shadowBlur=16;ctx.fillStyle=color;


    ctx.beginPath();ctx.arc(px,y,14,0,7);ctx.fill();ctx.restore();


    ctx.fillStyle='#04121c';ctx.font='bold 11px sans-serif';ctx.fillText(label,px-6,y+4);


  };


  ctx.save();


  ctx.fillStyle='#1b1b1b';ctx.strokeStyle='#1b1b1b';ctx.lineWidth=2;


  ctx.beginPath();ctx.arc(px,py,15,0,7);ctx.fill();


  ctx.beginPath();ctx.moveTo(px-12,py-9);ctx.lineTo(px-18,py-24);ctx.lineTo(px-3,py-14);ctx.closePath();ctx.fill();


  ctx.beginPath();ctx.moveTo(px+12,py-9);ctx.lineTo(px+18,py-24);ctx.lineTo(px+3,py-14);ctx.closePath();ctx.fill();


  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-5,py-1,3.4,0,7);ctx.fill();ctx.beginPath();ctx.arc(px+5,py-1,3.4,0,7);ctx.fill();


  ctx.fillStyle='#1b1b1b';ctx.beginPath();ctx.arc(px-5,py-1,1.5,0,7);ctx.fill();ctx.beginPath();ctx.arc(px+5,py-1,1.5,0,7);ctx.fill();


  // 胡须


  ctx.strokeStyle='#1b1b1b';ctx.lineWidth=1.2;


  ctx.beginPath();ctx.moveTo(px-7,py+5);ctx.lineTo(px-17,py+2);ctx.moveTo(px-7,py+7);ctx.lineTo(px-17,py+9);


  ctx.moveTo(px+7,py+5);ctx.lineTo(px+17,py+2);ctx.moveTo(px+7,py+7);ctx.lineTo(px+17,py+9);ctx.stroke();


  // 尾巴


  ctx.beginPath();ctx.moveTo(px-13,py+10);ctx.quadraticCurveTo(px-26,py+16,px-20,py+30);ctx.lineWidth=4;ctx.stroke();


  ctx.restore();


  for(const sm of S.summons){ ctx.save();ctx.fillStyle=sm.color||'#b07a45';ctx.strokeStyle='#1b1b1b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sm.x,sm.y,sm.r,0,7);ctx.fill();ctx.stroke();ctx.restore(); }


  for(const e of S.enemies){


    if(e.dead || e.hp<=0) continue;

    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();


    ctx.strokeStyle='#1b1b1b';ctx.lineWidth=2;ctx.stroke();


    // 眼睛与表情


    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-e.r*0.32,e.y-e.r*0.12,e.r*0.22,0,7);ctx.fill();ctx.beginPath();ctx.arc(e.x+e.r*0.32,e.y-e.r*0.12,e.r*0.22,0,7);ctx.fill();


    ctx.fillStyle='#1b1b1b';ctx.beginPath();ctx.arc(e.x-e.r*0.3,e.y-e.r*0.1,e.r*0.1,0,7);ctx.fill();ctx.beginPath();ctx.arc(e.x+e.r*0.34,e.y-e.r*0.1,e.r*0.1,0,7);ctx.fill();


    ctx.strokeStyle='#1b1b1b';ctx.lineWidth=1.6;ctx.beginPath();


    if(e.type==='healer'){ctx.moveTo(e.x-4,e.y+e.r*0.35);ctx.lineTo(e.x+4,e.y+e.r*0.35);}


    else{ctx.arc(e.x,e.y+e.r*0.18,e.r*0.28,0.15*Math.PI,0.85*Math.PI);}


    ctx.stroke();


    if(e.type==='boss'){ctx.fillStyle='#c25e2a';ctx.beginPath();ctx.moveTo(e.x-10,e.y-e.r-6);ctx.lineTo(e.x-4,e.y-e.r+2);ctx.lineTo(e.x,e.y-e.r-8);ctx.lineTo(e.x+4,e.y-e.r+2);ctx.lineTo(e.x+10,e.y-e.r-6);ctx.closePath();ctx.fill();}


    if(e.type==='tank'){ctx.strokeStyle='#5b4a8a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r-4,0,7);ctx.stroke();}


    if(e.markT>0){const a=0.45+0.35*Math.sin(S.t*8);ctx.save();ctx.strokeStyle='rgba(95,143,90,'+a.toFixed(2)+')';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,0,7);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#5f8f5a';ctx.beginPath();ctx.arc(e.x,e.y-e.r-14,3,0,7);ctx.fill();ctx.restore();}


    ctx.restore();


    const bw=e.r*2;


    ctx.fillStyle='#2a3644';ctx.fillRect(e.x-e.r,e.y-e.r-9,bw,4);


    ctx.fillStyle='#ff6b6b';ctx.fillRect(e.x-e.r,e.y-e.r-9,bw*Math.max(0,e.hp/e.maxhp),4);


    ctx.font='bold 12px sans-serif';


    const ew=ctx.measureText(e.elem||'').width;

      var sk={base:b,mods:mods,cd:0,stats:null}; recalc(sk); S.skills.push(sk);

    });

    S.locked=(d.locked||[]).map(function(id){return BASE.filter(function(b){return b.id===id;})[0];}).filter(Boolean);

    S.wave=d.wave; S.maxhp=d.maxhp; S.hp=d.hp; S.shield=d.shield||0; S.qi=d.qi||0;

    S.combo=d.combo||0; S.comboT=d.comboT||0; S.t=d.t||0;

    S.stats=d.stats||{kills:0,dmg:0,heal:0};

    S.running=true; S.paused=false; S.drafting=false; S.over=false; S.enemies=[]; S.bolts=[];

    renderSkills(); overlay.style.display='none'; waveTxt.textContent='第 '+S.wave+' 波'; spawnWave();

    hud('接着上一局：第 '+S.wave+' 波');

    return true;

  }

  window.wdResume=resume;

  var obs=new MutationObserver(function(){

    if(!panel) return;

    var h=panel.querySelector('h1');

    if(!h||h.textContent.indexOf('挑一个起手')<0) return;

    if(document.getElementById('resumeRun')) return;

    var d=readRun(); if(!d||!d.wave) return;

    var b=document.createElement('button');

    b.id='resumeRun'; b.className='btn';

    b.style.cssText='width:100%;margin:6px 0 2px;padding:10px;background:#c9603c;color:#fff';

    b.textContent='继续上一局（第 '+d.wave+' 波）';

    b.onclick=function(){ if(resume()) clearRun(); };

    var cards=panel.querySelector('#pickCards');

    panel.insertBefore(b, cards||null);

  });

  obs.observe(panel,{childList:true,subtree:true});

})();

</script>


<script>
(function(){
  var KEY='wd_run_v1', TS='wd_run_ts', AT='wd_at';
  function tok(){try{return localStorage.getItem(AT)||'';}catch(e){return '';}}
  function post(b){return fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
  var timer=null;
  function push(){
    var t=tok(); if(!t) return;
    var raw,ts; try{raw=localStorage.getItem(KEY); ts=Number(localStorage.getItem(TS))||Date.now();}catch(e){return;}
    if(!raw) return;
    var run; try{run=JSON.parse(raw);}catch(e){return;}
    run.ts=ts;
    clearTimeout(timer);
    timer=setTimeout(function(){ post({op:'save',token:t,run:run}).catch(function(){}); },1600);
  }
  var _set=Storage.prototype.setItem, _get=Storage.prototype.getItem;
  Storage.prototype.setItem=function(k,v){
    _set.apply(this,arguments);
    if(k===KEY){ try{_set.call(this,TS,String(Date.now()));}catch(e){} push(); }
  };
  function pull(){
    var t=tok(); if(!t) return;
    post({op:'load',token:t}).then(function(j){
      if(!j||!j.ok||!j.run) return;
      var rts=Number(j.run.ts)||0;
      var lts=0,raw=null;
      try{lts=Number(localStorage.getItem(TS))||0; raw=localStorage.getItem(KEY);}catch(e){}
      if(rts<=lts) return;
      try{
        _set.call(localStorage,KEY,JSON.stringify(j.run));
        _set.call(localStorage,TS,String(rts));
      }catch(e){return;}
      try{
        if(sessionStorage.getItem('wd_cloud_done')!=='1'){
          sessionStorage.setItem('wd_cloud_done','1');
          location.reload();
        }
      }catch(e){}
    }).catch(function(){});
  }
  window.addEventListener('DOMContentLoaded',function(){ setTimeout(pull,700); });
  window.wdCloud={push:push,pull:pull};
})();
</script>
